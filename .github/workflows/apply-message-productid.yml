name: Apply Message productId SQL and resolve migration

on:
  workflow_dispatch: {}

jobs:
  apply-and-resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply safe SQL to add Message.productId
        run: npx prisma db execute --file prisma/scripts/apply_message_productid.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Mark migration as applied
        run: npx prisma migrate resolve --applied 20260901164200_add_message_productid
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run remaining migrations (deploy)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
